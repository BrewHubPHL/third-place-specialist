name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate skill structure
        run: node scripts/validate-skill.mjs

      - name: Check for committed JWT-like tokens
        run: |
          ! grep -rE 'eyJ[a-zA-Z0-9_-]{30,}\.[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+' . \
            || (echo 'Possible JWT secret in repo — redact before publish' && exit 1)
